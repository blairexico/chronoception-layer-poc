[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chronoception"
version = "0.1.0"
description = "Temporal awareness for LLMs via generation-time intervention"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "accelerate",
    "bitsandbytes",
]

[project.optional-dependencies]
modal = ["modal"]

[tool.setuptools.packages.find]
include = ["chronoception*"]
